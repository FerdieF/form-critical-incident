services:
  app:
    build: .
    ports:
      - "8000:80"
    environment:
      APP_NAME: "Form Critical Incident"
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: form_karyawan
      DB_USERNAME: laravel
      DB_PASSWORD: secret
      # Set ke "true" untuk membuat akun awal (admin & peserta) saat pertama kali jalan
      SEED_DB: "true"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: form_karyawan
      MYSQL_USER: laravel
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dbdata:
